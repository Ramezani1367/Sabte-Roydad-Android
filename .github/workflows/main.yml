name: Build & Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ───────────────────────── ساخت APK اندروید ─────────────────────────
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (first run) & sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Apply custom icons
        run: bash scripts/prepare-android-icons.sh

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build release (unsigned) APK
        run: cd android && ./gradlew assembleRelease

      - name: Sign release APK (optional - needs secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          OUT=app/build/outputs/apk/release
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            SDK=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
            BT=$(ls "$SDK/build-tools" | sort -V | tail -1)
            "$SDK/build-tools/$BT/apksigner" sign \
              --ks keystore.jks --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
              --out "$OUT/app-release.apk" "$OUT/app-release-unsigned.apk"
            echo "release signed"
          else
            cp "$OUT/app-release-unsigned.apk" "$OUT/app-release.apk"
            echo "no keystore secret; release left unsigned (use debug APK)"
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

  # ───────────────────────── انتشار نسخهٔ وب (Pages) ─────────────────────────
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload www as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
